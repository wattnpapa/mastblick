<!doctype html><html lang="de"><head><meta charset="utf-8"><title>mastblick</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- mastblick: Karte für eine FRITZ!Box mit LTE – Ort über die Mobilfunkzelle, Masten, Track, Handy-GPS, Auswertungen.
     Daten kommen von mastblick-api unter api/… (gleicher Ursprung, Webserver leitet weiter). -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#111;color:#ddd;font-family:system-ui,sans-serif}
#map{position:fixed;inset:0;background:#111}
#map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.8) contrast(.9) saturate(.6)}
.mfritz{background:#c04bd6;border:2px solid #fff;border-radius:50%;box-shadow:0 0 6px #c04bd6}
.fp{background:#1a1a1af2;border:1px solid #333;border-radius:8px;padding:.5rem .65rem;color:#bbb;font:12px system-ui;width:250px;max-height:480px;overflow:auto}
.fp b{color:#eee;font-weight:500}.fp .sub{color:#888;font-size:11px}.fp hr{border:0;border-top:1px solid #333;margin:.45rem 0}
.fp button{background:#222;color:#ccc;border:1px solid #444;border-radius:5px;padding:.15rem .5rem;font-size:11px;cursor:pointer;margin:.1rem .15rem .1rem 0}
.fp button.on{background:#c04bd6;border-color:#c04bd6;color:#fff}.fp button.pri{border-color:#c04bd6;color:#e9b6f3}
.fp input{background:#111;color:#ddd;border:1px solid #444;border-radius:5px;padding:.15rem .4rem;font-size:11px;width:135px}
.fp a{color:#9ec5ff}.fp a.btn{display:inline-block;background:#222;border:1px solid #c04bd6;color:#e9b6f3;border-radius:5px;padding:.15rem .5rem;font-size:11px;text-decoration:none;margin:.15rem 0}.fp .msg{color:#e0a040;margin-top:.2rem}.fp .okm{color:#7ac943}.fp .om{border-top:1px dotted #333;padding:.3rem 0}.fp table.gt{border-collapse:collapse;font-size:10.5px;margin:.2rem 0;width:100%}.fp table.gt td,.fp table.gt th{padding:1px 3px;text-align:right;border-bottom:1px solid #2a2a2a}.fp table.gt th{color:#999;font-weight:normal}.fp table.gt td:first-child,.fp table.gt th:first-child{text-align:left}
.mmast{background:none;border:0}.mmast svg{display:block;filter:drop-shadow(0 0 2px #000)}.mmast.vor{opacity:.75;cursor:pointer}
#map.full{position:fixed!important;inset:0;width:100vw;height:100vh;height:100dvh!important;z-index:5000;border-radius:0;margin:0}
.fp .fphead{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:.5rem}.fp.zu .fpbody{display:none}.fp.zu{width:auto}
.fp .fphead small{color:#888;font-weight:400}
.mctl a{display:block;width:30px;height:30px;line-height:30px;text-align:center;background:#fff;color:#222;font:16px system-ui;text-decoration:none;cursor:pointer}
.mctl a.on{background:#2f8cff;color:#fff}
.mme{background:#2f8cff;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 4px #2f8cff55}
@media(max-width:700px){.fp{width:205px;max-height:55vh;max-height:55dvh}}
.vpop{font:12px system-ui;color:#222}.vpop button{margin:.3rem .3rem 0 0;padding:.15rem .5rem;font-size:11px;cursor:pointer}
.mflow{animation:mflow linear infinite}.lnkm{animation-duration:1.1s}@keyframes mflow{to{stroke-dashoffset:-18.1}}
.leaflet-container{font:12px system-ui}.leaflet-control-attribution{background:#000a!important;color:#888}.leaflet-control-attribution a{color:#9bd}
#titel{position:fixed;left:56px;bottom:10px;z-index:1000;font:600 13px system-ui;color:#ccc;text-shadow:0 0 4px #000;pointer-events:none}
</style></head><body>
<div id="map"></div><div id="titel">mastblick</div>
<script>
// Push vom Server (SSE, api/mast/stream): solange Ereignisse kommen, fragt die Seite nicht selbst ab
let SSE_T=0; const sseFresh=()=>Date.now()-SSE_T<25000;
function sseStart(){
  if(!window.EventSource)return; const es=new EventSource("api/mast/stream");
  const on=(n,f)=>es.addEventListener(n,e=>{SSE_T=Date.now();try{f(JSON.parse(e.data))}catch(x){console.warn("SSE",n,x)}});
  on("ping",()=>{}); on("fritzgeo",d=>loadFritzGeo(d));
  on("tracking",d=>{if(MAP){MAP.otState=d;renderFP()}}); on("masten",()=>{if(MAP){loadMasten();loadMast()}}); on("gps",d=>gpsLive(d));
  es.onerror=()=>{SSE_T=0};
}
let MAP=null, VIEW="karte", FGEO=null, BOX=null;
async function loadFritzGeo(D){
  if(D)FGEO=D; else{if(sseFresh()&&FGEO)return; try{FGEO=await api("api/mast/status")}catch(e){return}}
  const g=FGEO&&FGEO.geo; if(g&&g.lat!=null)BOX=[g.lat,g.lng];
  const zc=FGEO&&FGEO.ok&&(FGEO.zellen||[])[0], zk=zc?zc.cellid:null;
  if(MAP&&zk&&zk!==MAP.zelleAlt&&Date.now()-LINK_T>30000){LINK_T=Date.now();MAP.zelleAlt=zk;if(MAP.masten)loadMasten()}
  if(MAP){placeFritz();drawLinks();renderFP()}
}
// Verbindungslinien: gelb laufend = Handy ↔ verbundener Mast, orange laufend = berechnete Box-Position ↔ Mast,
// türkis gepunktet = Handy ↔ berechnete Box-Position (Ortungsfehler)
let MAST_DB={}, MAST_VOR=[], LINK_T=0;
function handyOrt(){return MAP.phone&&Date.now()/1000-MAP.phoneT<120?MAP.phone.getLatLng():MAP.me?MAP.me.getLatLng():null}
function mastLinie(name,von,m,z,vor,farbe,breite,wer){
  if(!von||!m){if(MAP[name]){MAP[name].remove();MAP[name]=null}return}
  const ll=[[m.lat,m.lng],von], d=Math.round(von.distanceTo([m.lat,m.lng]));
  const txt=`<b>${wer} ↔ Mast eNB ${z.enb} · Sektor ${z.sektor}</b>${vor?" (Mast nur vorgeschlagen)":""}<br>${d} m Luftlinie${z.distanz_m?` · Box meldet ${z.distanz_m} m`:""} · RSRP ${z.rsrp} dBm`;
  const st={color:vor?"#c9b458":farbe,weight:breite};
  if(!MAP[name])MAP[name]=L.polyline(ll,{...st,opacity:.95,dashArray:"7 11",className:"mflow lnkm"}).bindTooltip(txt,{sticky:true}).addTo(MAP.m);
  else MAP[name].setLatLngs(ll).setTooltipContent(txt).setStyle(st);
}
function drawLinks(){
  if(!MAP||!MAP.m)return; const z=FGEO&&FGEO.ok&&(FGEO.zellen||[])[0], g=FGEO&&FGEO.geo, ph=handyOrt();
  let m=null, vor=false;
  if(z){const k=`${z.plmn}:${z.enb}`; m=MAST_DB[`${k}:${z.sektor}`]||MAST_DB[k];
    if(!m){m=MAST_VOR.find(v=>v.schluessel===`${k}:${z.sektor}`)||MAST_VOR.find(v=>v.schluessel===k);vor=!!m}}
  const box=z&&g&&g.lat!=null?L.latLng(g.lat,g.lng):null;
  mastLinie("lnkMast",ph,z?m:null,z,vor,"#ffd400",2.5,"Handy");
  // ohne Abstand keine Linie (Box-Position ist bei bekanntem Mast oft der Mast selbst)
  mastLinie("lnkBox",box&&m&&box.distanceTo([m.lat,m.lng])>30?box:null,z?m:null,z,vor,"#ff9a1f",2,"FRITZ!Box (berechnet)");
  if(ph&&box){const ll=[ph,box], d=Math.round(ph.distanceTo(box));
    const txt=`<b>Handy ↔ berechnete Box-Position</b><br>${d<1000?d+" m":(d/1000).toFixed(1).replace(".",",")+" km"} daneben · Quelle ${esc(g.quelle||"?")}`;
    if(!MAP.lnkPh)MAP.lnkPh=L.polyline(ll,{color:"#3fd0d0",weight:2,opacity:.8,dashArray:"2 6"}).bindTooltip(txt,{sticky:true}).addTo(MAP.m);
    else MAP.lnkPh.setLatLngs(ll).setTooltipContent(txt)}
  else if(MAP.lnkPh){MAP.lnkPh.remove();MAP.lnkPh=null}
}
// Ortungs-Fokus: solange Handy-Tracking, Mitschreiben oder Folgen läuft, die festen Standorte und ihre Tunnel-Linien
// ausblenden – sie laufen sonst quer über die Fahrstrecke
function fokus(){
  if(!MAP||!MAP.m)return; const an=!!((MAP.otState&&MAP.otState.an)||REC.on||FOLGEN);
  if(an===MAP.fokus)return; MAP.fokus=an;
  for(const [k,mk] of Object.entries(MAP.marks)){if(k==="fritz")continue; an?mk.remove():mk.addTo(MAP.m)}
  for(const ln of Object.values(MAP.links))for(const l of [ln.base,ln.in,ln.out])an?l.remove():l.addTo(MAP.m);
}
setInterval(drawLinks,15000);   // Handy-Position veraltet → Linien umhängen bzw. ausblenden
// Box: violetter Punkt mit Genauigkeitskreis (gestrichelter Ring = Abstand zum bekannten Mast)
function placeFritz(){
  const p=BOX; if(!p)return;
  const acc=(FGEO.geo&&FGEO.geo.genauigkeit_m)||0;
  const ring=!!(FGEO.geo&&FGEO.geo.mast);
  const st=ring?{radius:acc,color:"#c04bd6",weight:2,opacity:.8,dashArray:"4 5",fill:false,interactive:false}
               :{radius:acc,color:"#c04bd6",weight:1,opacity:.6,dashArray:null,fill:true,fillOpacity:.08,interactive:false};
  if(!MAP.fcirc)MAP.fcirc=L.circle(p,st).addTo(MAP.m); else MAP.fcirc.setLatLng(p).setStyle(st).setRadius(acc);
  const txt=`<b>FRITZ!Box</b>${fritzGeoText()}`;
  if(!MAP.box){MAP.box=L.marker(p,{icon:L.divIcon({className:"mfritz",iconSize:[14,14],iconAnchor:[7,7]}),zIndexOffset:900,keyboard:false}).bindTooltip(txt).addTo(MAP.m);
    if(!MAP.gesehen){MAP.gesehen=true;MAP.m.setView(p,13)}}
  else MAP.box.setLatLng(p).setTooltipContent(txt);
}
setInterval(loadFritzGeo,60000);
// ---- FRITZ!Box mobil: Track und "Mast ermitteln" (API /api/mast, Dienst fritz-mast-api) ----
let TRACK_H=0, TRACK_Q="", ABSCHNITTE=[], ABDECKUNG=false, MS=null, FP_OPEN=null, OM_OPEN=false, ME_WATCH=null, FOLGEN=false;
let FP_ZU=(()=>{try{const v=localStorage.getItem("fpZu");return v===null?innerWidth<700:v==="1"}catch(e){return innerWidth<700}})();
// Mitschreiben: Handy-GPS laufend an den Server, Bildschirm bleibt an (Wake Lock), Box wird dann alle 10 s abgefragt
const REC={on:false,watch:null,buf:[],n:0,last:null,wake:null,err:"",timer:null};
async function recStart(){
  if(!isSecureContext||!navigator.geolocation){REC.err="Standort gibt der Browser nur über HTTPS heraus.";return renderFP()}
  REC.on=true;REC.err="";
  REC.watch=navigator.geolocation.watchPosition(p=>{const c=p.coords;REC.last=c;REC.buf.push({t:p.timestamp||Date.now(),lat:c.latitude,lng:c.longitude,acc:c.accuracy,speed:c.speed,heading:c.heading});recInfo();showMe(c,true)},
    e=>{REC.err=e.message;recInfo()},{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  REC.timer=setInterval(recFlush,15000);
  try{REC.wake=await navigator.wakeLock.request("screen")}catch(e){}
  renderFP();
}
// Eigener Standort (blauer Punkt mit Genauigkeitskreis), Live-Linie beim Mitschreiben, Folgen-Modus
function showMe(c,trail){
  if(!MAP)return; const p=[c.latitude,c.longitude];
  if(!MAP.me){MAP.meAcc=L.circle(p,{radius:c.accuracy,color:"#2f8cff",weight:1,fillOpacity:.12,interactive:false}).addTo(MAP.m);
    MAP.me=L.marker(p,{icon:L.divIcon({className:"mme",iconSize:[14,14],iconAnchor:[7,7]}),keyboard:false,zIndexOffset:1000,title:"mein Standort"}).addTo(MAP.m)}
  else{MAP.me.setLatLng(p);MAP.meAcc.setLatLng(p).setRadius(c.accuracy)}
  if(trail&&c.accuracy<=50){if(!MAP.live)MAP.live=L.polyline([],{color:"#7ac943",weight:3,opacity:.9,interactive:false}).addTo(MAP.m);MAP.live.addLatLng(p)}
  if(FOLGEN)MAP.m.panTo(p,{animate:true});
  drawLinks();
}
function meToggle(){
  if(ME_WATCH!==null||FOLGEN){FOLGEN=false;if(ME_WATCH!==null&&!REC.on){navigator.geolocation.clearWatch(ME_WATCH)}ME_WATCH=null;meBtn();return}
  if(!isSecureContext||!navigator.geolocation){alert("Standort gibt der Browser nur über HTTPS heraus.");return}
  FOLGEN=true; if(!REC.on)ME_WATCH=navigator.geolocation.watchPosition(p=>showMe(p.coords,false),()=>{},{enableHighAccuracy:true,maximumAge:5000});
  else ME_WATCH=-1; if(REC.last)showMe(REC.last,false); meBtn();
}
function meBtn(){const b=document.getElementById("mebtn");if(b)b.classList.toggle("on",FOLGEN);fokus()}
function fullToggle(force){const el=document.getElementById("map");const on=force===undefined?!el.classList.contains("full"):force;
  el.classList.toggle("full",on);document.body.style.overflow=on?"hidden":"";const b=document.getElementById("fullbtn");if(b){b.classList.toggle("on",on);b.textContent=on?"✕":"⛶"}
  setTimeout(()=>MAP.m.invalidateSize(),50)}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.getElementById("map").classList.contains("full"))fullToggle(false)});
setInterval(()=>{if(MAP&&TRACK_H&&VIEW==="karte"&&!sseFresh())loadTrack(true)},60000);
// Neue Handy-Positionen per Push: Live-Marker für alle Betrachter, Track höchstens alle 10 s nachladen
let GPS_TL=0;
function gpsLive(pts){
  if(!MAP||!pts.length)return; const q=pts[pts.length-1], p=[q[1],q[2]];
  const txt=`Handy (${q[4]==="owntracks"?"OwnTracks":q[4]==="browser"?"Browser":"GPS"}) ±${q[3]} m · ${tfmt(q[0])}`;
  if(!MAP.phone)MAP.phone=L.circleMarker(p,{radius:6,color:"#fff",weight:2,fillColor:"#3fd0d0",fillOpacity:1}).bindTooltip(txt).addTo(MAP.m);
  else MAP.phone.setLatLng(p).setTooltipContent(txt);
  MAP.phoneT=q[0]; drawLinks();
  if(TRACK_H&&Date.now()-GPS_TL>10000){GPS_TL=Date.now();loadTrack(true)}
}
async function recFlush(){
  if(!REC.buf.length)return; const b=REC.buf.splice(0,500);
  try{const r=await api("api/mast/gps",{punkte:b});REC.n+=r.gespeichert;REC.err=""}catch(e){REC.buf.unshift(...b);REC.err="Senden fehlgeschlagen, wird wiederholt ("+e.message+")"}
  recInfo();
}
function recStop(){navigator.geolocation.clearWatch(REC.watch);clearInterval(REC.timer);recFlush();if(REC.wake)REC.wake.release().catch(()=>{});REC.on=false;REC.wake=null;renderFP()}
function recInfo(){const e=document.getElementById("recinfo");if(!e)return;const c=REC.last;
  e.innerHTML=`${REC.n} gesendet, ${REC.buf.length} wartend${c?` · ±${Math.round(c.accuracy)} m${c.speed!=null?` · ${Math.round(c.speed*3.6)} km/h`:""}`:" · warte auf GPS"}${REC.err?`<div class="msg">${esc(REC.err)}</div>`:""}`}
document.addEventListener("visibilitychange",async()=>{if(REC.on&&document.visibilityState==="visible"){try{REC.wake=await navigator.wakeLock.request("screen")}catch(e){}}});
const api=async(u,b)=>{const r=await fetch(u,b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:{});const j=await r.json().catch(()=>({fehler:"HTTP "+r.status}));if(!r.ok)throw new Error(j.fehler||("HTTP "+r.status));return j};
const tfmt=s=>new Date(s*1000).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// CellMapper nur als Link zum Nachsehen (automatische Abfragen verbieten deren Nutzungsbedingungen)
const cmLink=(lat,lng)=>{const pl=((FGEO&&FGEO.zellen||[])[0]||{}).plmn||"26201";return `https://www.cellmapper.net/map?MCC=${pl.slice(0,3)}&MNC=${+pl.slice(3)}&type=LTE&latitude=${lat}&longitude=${lng}&zoom=14`};
function addFritzPanel(){
  const C=L.Control.extend({onAdd(){const d=L.DomUtil.create("div","fp");L.DomEvent.disableClickPropagation(d);L.DomEvent.disableScrollPropagation(d);return d}});
  MAP.fp=new C({position:"topright"}).addTo(MAP.m);
  const B=L.Control.extend({onAdd(){const d=L.DomUtil.create("div","leaflet-bar mctl");
    d.innerHTML='<a id="mebtn" title="mein Standort, Karte folgt">◎</a>';L.DomEvent.disableClickPropagation(d);
    d.querySelector("#mebtn").onclick=meToggle;return d}});
  new B({position:"topleft"}).addTo(MAP.m);
  MAP.m.on("dragstart",()=>{if(FOLGEN){FOLGEN=false;meBtn()}});
  MAP.track=L.layerGroup().addTo(MAP.m); MAP.obs=L.layerGroup().addTo(MAP.m); MAP.masten=L.layerGroup().addTo(MAP.m);
  renderFP(); loadMast(); loadMasten(); loadOT(); loadAbschnitte(); setInterval(loadAbschnitte,300000); loadAusw(); setInterval(loadAusw,300000); setInterval(()=>{if(!sseFresh())loadOT()},30000);
}
// Bekannte Masten aus der eigenen Datenbank als kleines Antennen-Symbol (Sektor-Einträge mit grüner Spitze)
const MAST_SVG=(c,s="#ddd")=>`<svg width="12" height="16" viewBox="0 0 12 16"><path d="M6 3 L2.5 15 M6 3 L9.5 15 M3.6 11 H8.4 M4.4 7.5 H7.6" stroke="${s}" stroke-width="1.4" fill="none" stroke-linecap="round"/><circle cx="6" cy="2.4" r="1.9" fill="${c}"/></svg>`;
async function loadMasten(){
  let m; try{m=await api("api/mast/masten")}catch(e){return}
  MAP.masten.clearLayers(); MAST_DB=m;
  for(const [k,v] of Object.entries(m)){const [pl,enb,sek]=k.split(":");
    L.marker([v.lat,v.lng],{icon:L.divIcon({className:"mmast",html:MAST_SVG(sek?"#7ac943":"#e0a040"),iconSize:[12,16],iconAnchor:[6,15]}),keyboard:false,zIndexOffset:-500})
     .bindTooltip(`<b>Mast eNB ${enb}${sek?` · Sektor ${sek}`:""}</b> <span style="color:#999">(${pl})</span>${v.notiz?`<br>${esc(v.notiz)}`:""}<br><span style="color:#999">${esc(v.quelle)} · ${esc(v.erfasst)}</span>`).addTo(MAP.masten)}
  // Vorschläge aus den Messpaaren (Handy-GPS + Abstand): grau, Klick zum Übernehmen oder Verwerfen
  let vs=[]; try{vs=await api("api/mast/vorschlaege")}catch(e){}
  MAST_VOR=vs; drawLinks();
  for(const v of vs){const [pl,enb,sek]=v.schluessel.split(":");
    const txt=`<b>Vorschlag: Mast eNB ${enb}${sek?` · Sektor ${sek}`:""}</b><br>berechnet aus ${v.anzahl} Messungen, Restfehler ±${v.rms_m} m${v.eindeutig?"":`<br><span style="color:#c60">mehrdeutig: Messpunkte fast auf einer Linie, Mast kann auch gespiegelt auf der anderen Straßenseite stehen</span>`}`;
    const mk=L.marker([v.lat,v.lng],{icon:L.divIcon({className:"mmast vor",html:MAST_SVG(v.eindeutig?"#bbb":"#c60","#999"),iconSize:[12,16],iconAnchor:[6,15]}),keyboard:false,zIndexOffset:-600}).bindTooltip(txt+"<br><i>Klick: übernehmen oder verwerfen</i>").addTo(MAP.masten);
    const box=L.DomUtil.create("div","vpop"); box.innerHTML=txt+`<br><button data-a="ok">übernehmen</button><button data-a="no">verwerfen</button><div class="m"></div>`;
    box.querySelectorAll("button").forEach(b=>b.onclick=async()=>{try{
      if(b.dataset.a==="ok")await api("api/mast/setzen",{schluessel:v.schluessel,lat:v.lat,lng:v.lng,quelle:`angelernt aus ${v.anzahl} Messfahrt-Punkten (±${v.rms_m} m${v.eindeutig?"":", mehrdeutig"})`});
      else await api("api/mast/verwerfen",{schluessel:v.schluessel});
      MAP.m.closePopup(); loadMasten(); loadMast(); setTimeout(loadFritzGeo,4000); if(TRACK_H)loadTrack();
    }catch(e){box.querySelector(".m").textContent=e.message}});
    mk.bindPopup(box);
  }
}
async function loadOT(){try{MAP.otState=await api("api/mast/tracking");renderFP()}catch(e){}}
async function loadAbschnitte(){try{ABSCHNITTE=await api("api/mast/abschnitte");renderFP()}catch(e){}}
// Netzabdeckung: Kacheln ~110 m, Farbe nach Median-RSRP der primären Zelle
const RSRP_F=r=>r>=-80?"#2ecc40":r>=-90?"#9be15d":r>=-100?"#ffdc00":r>=-110?"#ff851b":"#ff4136";
async function loadAbdeckung(){
  if(!MAP.abd)MAP.abd=L.layerGroup(); MAP.abd.clearLayers();
  if(!ABDECKUNG){MAP.abd.remove();if(MAP.abdLeg){MAP.abdLeg.remove();MAP.abdLeg=null}return}
  MAP.abd.addTo(MAP.m); let k=[]; try{k=await api("api/mast/abdeckung")}catch(e){return}
  for(const c of k)L.rectangle([[c.lat-.0005,c.lng-.0008],[c.lat+.0005,c.lng+.0008]],{stroke:false,fillColor:RSRP_F(c.rsrp),fillOpacity:Math.min(.65,.25+c.n*.05)})
    .bindTooltip(`RSRP ${c.rsrp} dBm${c.rsrq!=null?` · RSRQ ${c.rsrq} dB`:""}<br>${c.n} Messung${c.n===1?"":"en"} · eNB ${c.enb.join(", ")}`).addTo(MAP.abd);
  if(!MAP.abdLeg){const G=L.Control.extend({onAdd(){const d=L.DomUtil.create("div","fp");d.style.width="auto";
    d.innerHTML="<b>RSRP</b> "+[[-80,"≥ −80"],[-90,"−90"],[-100,"−100"],[-110,"−110"],[-120,"< −110"]].map(([r,t])=>`<span style="color:${RSRP_F(r)}">■</span> ${t}`).join(" ");return d}});
    MAP.abdLeg=new G({position:"bottomright"}).addTo(MAP.m)}
}
// ---- Auswertungen (API /api/mast/auswertung): Ortungsgüte, Funklöcher/Latenz, Versorgungsgebiete, Masten nachschärfen ----
let AUSW=null, L_FUNK=false, L_GEB=false, AUSW_OPEN=false;
async function loadAusw(){try{AUSW=await api("api/mast/auswertung")}catch(e){AUSW={fehler:e.message}} drawFunk();drawGeb();drawKorr();renderFP()}
const RTT_F=r=>r<60?"#2ecc40":r<120?"#9be15d":r<250?"#ffdc00":r<500?"#ff851b":"#ff4136";
function drawFunk(){

    else{
      const b=MS.berechnet, n=MS.beobachtungen.length;
      h+=`<div style="margin-top:.3rem"><b>Anlernen</b> <span class="sub">(Gerät im WLAN der Box)</span></div>
        <button data-act="obs">Meinen Standort beitragen</button>${n?`<button data-act="obsdel">${n} löschen</button>`:""}
        <div class="sub">${n} Beobachtung${n===1?"":"en"}; ab 3 an verschiedenen Stellen (≥100 m auseinander) wird der Mast berechnet.${isSecureContext?"":" Standort gibt der Browser nur über HTTPS heraus."}</div>`;
      if(b)h+=`<div class="okm">berechnet: ${b.lat}, ${b.lng} (±${b.rms_m} m aus ${b.anzahl})</div><button class="pri" data-act="takecalc">übernehmen</button>`;
      const s=MS.schaetzung_beacondb, m=MS.mast;
      h+=`<div style="margin-top:.3rem"><b>Nachsehen und eintragen</b></div>`+mastForm("",(m||s||{}).lat,(m||s||{}).lng);
      if(MS.mast)h+=`<button data-act="del">Mast aus Datenbank löschen</button>`;
      h+=`<button data-act="close">schließen</button>`;
    }}
  h+=`<div class="msg" id="fpmsg"></div></div>`;
  el.innerHTML=h;
  el.querySelector(".fphead").onclick=()=>{FP_ZU=!FP_ZU;try{localStorage.setItem("fpZu",FP_ZU?"1":"0")}catch(e){}renderFP()};
  // Anlern-Ringe des aktuellen Masts zeigen, solange "Mast ermitteln" offen ist
  MAP.obs.clearLayers();
  if(FP_OPEN==="cur"&&MS&&MS.ok){MS.beobachtungen.forEach(o=>{L.circle([o.lat,o.lng],{radius:o.distanz_m,color:"#7ac943",weight:1,fill:false,dashArray:"3 4",interactive:false}).addTo(MAP.obs);L.circleMarker([o.lat,o.lng],{radius:3,color:"#7ac943"}).addTo(MAP.obs)});
    if(MS.berechnet)L.circleMarker([MS.berechnet.lat,MS.berechnet.lng],{radius:6,color:"#7ac943",fillOpacity:.8}).bindTooltip("berechneter Mast").addTo(MAP.obs)}
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>fpAction(b.dataset,el)); recInfo();
  const ts=el.querySelector("#tracksel"); if(ts)ts.onchange=()=>{TRACK_Q=ts.value;TRACK_H=TRACK_Q?1:0;loadTrack()};
  const ab=el.querySelector("#abdsel"); if(ab)ab.onchange=()=>{ABDECKUNG=ab.checked;loadAbdeckung()};
  const fu=el.querySelector("#funksel"); if(fu)fu.onchange=()=>{L_FUNK=fu.checked;drawFunk();if(L_FUNK)loadAusw()};
  const ge=el.querySelector("#gebsel"); if(ge)ge.onchange=()=>{L_GEB=ge.checked;drawGeb();if(L_GEB)loadAusw()};
  el.querySelectorAll(".om button[data-s]").forEach(b=>b.onclick=()=>korrAktion(b.dataset,el.querySelector("#fpmsg")));
}
async function fpAction(d,el){
  const msg=t=>{const m=el.querySelector("#fpmsg");if(m)m.textContent=t};
  try{
    if(d.act==="track"){TRACK_H=+d.h;return loadTrack()}
    if(d.act==="omfold"){OM_OPEN=!OM_OPEN;return renderFP()}
    if(d.act==="auswfold"){AUSW_OPEN=!AUSW_OPEN;if(AUSW_OPEN)loadAusw();return renderFP()}
    if(d.act==="oton"){MAP.otState=await api("api/mast/tracking",{an:d.an==="1"});return renderFP()}
    if(d.act==="recstart")return recStart();
    if(d.act==="recstop")return recStop();
    if(d.act==="open"){FP_OPEN=d.key;return renderFP()}
    if(d.act==="close"){FP_OPEN=null;return renderFP()}
    const done=async r=>{MS=r;FP_OPEN=null;renderFP();loadMasten();setTimeout(loadFritzGeo,4000);if(TRACK_H)loadTrack()};
    if(d.act==="save"){const v=el.querySelector(`input[data-key="${CSS.escape(d.key)}"]`).value.match(/(-?\d+(?:[.,]\d+)?)\s*[,; ]\s*(-?\d+(?:[.,]\d+)?)/);
      if(!v)return msg("Koordinaten als „Breite, Länge“ eingeben, z. B. 52.5163, 13.3777");
      const body={lat:+v[1].replace(",","."),lng:+v[2].replace(",","."),quelle:"manuell eingetragen"}; if(d.key)body.schluessel=d.key;
      else if(el.querySelector("#fpsek")?.checked)body.sektor=true;
      return done(await api("api/mast/setzen",body))}
    if(d.act==="takecalc")return done(await api("api/mast/setzen",{lat:MS.berechnet.lat,lng:MS.berechnet.lng,sektor:!!el.querySelector("#fpsek")?.checked,quelle:`angelernt aus ${MS.berechnet.anzahl} Beobachtungen (±${MS.berechnet.rms_m} m)`}));
    if(d.act==="del"){if(!confirm("Mast aus der eigenen Datenbank löschen?"))return; return done(await api("api/mast/loeschen",{}))}
    if(d.act==="obsdel"){if(!confirm("Alle Beobachtungen für diesen Mast löschen?"))return; MS=await api("api/mast/beobachtungen-loeschen",{});return renderFP()}
    if(d.act==="obs"){
      if(!navigator.geolocation||!isSecureContext)return msg("Standort gibt der Browser nur über HTTPS heraus.");
      msg("Standort wird ermittelt …");
      const pos=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:20000,maximumAge:0}));
      MS=await api("api/mast/beobachtung",{lat:pos.coords.latitude,lng:pos.coords.longitude,genauigkeit_m:pos.coords.accuracy});
      renderFP(); msg(`gespeichert (±${Math.round(pos.coords.accuracy)} m)`)}
  }catch(e){msg(e.message||String(e))}
}
function fritzGeoText(){
  const f=FGEO, g=f&&f.geo; if(!g||g.lat==null)return `<div>unterwegs, Ort unbekannt${g?" ("+g.quelle+")":""}</div>`;
  const t=s=>new Date(s*1000).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  const z=(f.zellen||[])[0]||{}, km=(g.genauigkeit_m/1000).toLocaleString("de-DE",{maximumFractionDigits:1});
  const alt=!f.ok||Date.now()/1000-f.abgefragt>900;
  if(g.mast)return `<div>am Mast eNB ${g.enb} (eigene Datenbank)</div><div>Box ca. ${z.distanz_m||"?"} m vom Mast${z.rsrp?` · ${z.rsrp} dBm`:""}</div>`+
    `<div${alt?' class="old"':""}>${alt?"letzter bekannter Ort, ":""}Stand ${t(f.abgefragt)}</div>`;
  return `<div>${esc(g.quelle||"Zelle")}${g.anzahl?` (${g.anzahl} Messungen)`:""}: ${g.lat.toFixed(3)}, ${g.lng.toFixed(3)} ±${km} km</div>`+
    (g.gehalten?`<div class="old">Sprung von ${g.verworfen?.quelle||"?"} (${((g.verworfen?.sprung_m||0)/1000).toFixed(1)} km) als unplausibel verworfen</div>`:"")+
    `<div>${z.cellid||"?"}${z.distanz_m?` · ${z.distanz_m} m zum Mast`:""}${z.rsrp?` · ${z.rsrp} dBm`:""}</div>`+
    `<div${alt?' class="old"':""}>${alt?"letzter bekannter Ort, ":""}Stand ${t(f.abgefragt)}</div>`;
}

function initMap(){
  const m=L.map("map",{scrollWheelZoom:true,wheelPxPerZoomLevel:90,zoomSnap:.25}).setView([51.2,10.4],6);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(m);
  MAP={m,links:{},marks:{}};
  addFritzPanel(); loadFritzGeo();
}
initMap(); sseStart();
</script></body></html>
